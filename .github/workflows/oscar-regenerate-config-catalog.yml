name: Oscar one-shot config catalog regeneration

on:
  push:
    branches:
      - agent/intermediate-binding-admission
    paths:
      - .github/workflows/oscar-regenerate-config-catalog.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/intermediate-binding-admission
          persist-credentials: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Regenerate repository-owned documentation
        run: |
          set -euo pipefail
          pnpm run gen-config-catalog
          pnpm run verify-translation-pairing --write packages/code-runtime/code-runtime-worker-thread/README.md

      - name: Commit generated files and remove this one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/oscar-regenerate-config-catalog.yml
          git add docs/config-catalog.md \
            packages/code-runtime/code-runtime-worker-thread/README.i18n.yaml \
            .github/workflows/oscar-regenerate-config-catalog.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: regenerate worker runtime config catalog'
          git push origin HEAD:agent/intermediate-binding-admission
