name: Oscar one-shot Execution DevTools summary
# retry: corrected execution-accounting package export

on:
  push:
    branches:
      - agent/execution-devtools-summary
    paths:
      - .github/workflows/oscar-execution-devtools-once.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/execution-devtools-summary
          persist-credentials: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Apply Execution DevTools patch
        run: |
          python scripts/oscar_execution_devtools_preface.py
          python scripts/oscar_execution_devtools_patch.py
          python scripts/oscar_execution_devtools_testfix.py
      - name: Refresh translation pairing
        run: |
          pnpm run verify-translation-pairing --write packages/core/tools/README.md
          pnpm run verify-translation-pairing --write packages/client/ui-trajectory/README.md
      - name: Run execution accounting tests
        run: pnpm exec vitest run packages/core/tools/tests/execution-accounting.spec.ts
      - name: Run Execution DevTools focused tests
        run: pnpm exec vitest run packages/client/ui-trajectory/tests/snapshot-builder.client.spec.ts packages/client/ui-trajectory/tests/execution-view.client.spec.tsx
      - name: Run full trajectory package tests
        run: pnpm exec vitest run packages/client/ui-trajectory/tests
      - name: Run repository static gates
        run: pnpm run check:ci:static
      - name: Commit verified non-workflow implementation
        run: |
          set -euo pipefail
          rm scripts/oscar_execution_devtools_preface.py
          rm scripts/oscar_execution_devtools_patch.py
          rm scripts/oscar_execution_devtools_testfix.py
          git add \
            packages/core/tools/package.json \
            packages/core/tools/README.md \
            packages/core/tools/README.zh.md \
            packages/core/tools/README.i18n.yaml \
            packages/client/ui-trajectory/README.md \
            packages/client/ui-trajectory/README.zh.md \
            packages/client/ui-trajectory/README.i18n.yaml \
            packages/client/ui-trajectory/src/client/trajectory-contract.ts \
            packages/client/ui-trajectory/src/client/trajectory-tool-definition.ts \
            packages/client/ui-trajectory/src/client/trajectory-snapshot-builder.ts \
            packages/client/ui-trajectory/src/client/ExecutionView.tsx \
            packages/client/ui-trajectory/src/client/TrajectoryDevtoolsView.tsx \
            packages/client/ui-trajectory/src/client/locales.ts \
            packages/client/ui-trajectory/tests/snapshot-builder.client.spec.ts \
            packages/client/ui-trajectory/tests/execution-view.client.spec.tsx \
            scripts/oscar_execution_devtools_preface.py \
            scripts/oscar_execution_devtools_patch.py \
            scripts/oscar_execution_devtools_testfix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(devtools): add Code Mode execution summary'
          git push origin HEAD:agent/execution-devtools-summary
