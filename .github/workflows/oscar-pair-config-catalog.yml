name: Oscar one-shot config catalog pairing

on:
  push:
    branches:
      - agent/intermediate-binding-admission
    paths:
      - .github/workflows/oscar-pair-config-catalog.yml

permissions:
  contents: write

jobs:
  pair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/intermediate-binding-admission
          persist-credentials: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Synchronize generated config declaration into Chinese catalog
        shell: python
        run: |
          from pathlib import Path
          path = Path('docs/config-catalog.zh.md')
          text = path.read_text()
          needle = """  maxOutputBytes?: number\n  /** The worker's max old-generation heap in MiB (`resourceLimits`); overflow kills the worker, surfacing as kind `'worker-exit'`. */\n"""
          replacement = """  maxOutputBytes?: number\n  /**\n   * Hard cap for each serialized binding argument and binding resolution. Zero disables\n   * this admission budget so the mechanism can ship before benchmark evidence sets a default.\n   */\n  maxBindingValueBytes?: number\n  /** The worker's max old-generation heap in MiB (`resourceLimits`); overflow kills the worker, surfacing as kind `'worker-exit'`. */\n"""
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one config-catalog insertion point, found {text.count(needle)}')
          path.write_text(text.replace(needle, replacement, 1))

      - name: Refresh catalog pairing record
        run: pnpm run verify-translation-pairing --write docs/config-catalog.md

      - name: Commit paired catalog and remove this one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/oscar-pair-config-catalog.yml
          git add docs/config-catalog.zh.md docs/config-catalog.i18n.yaml \
            .github/workflows/oscar-pair-config-catalog.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: pair worker runtime config catalog'
          git push origin HEAD:agent/intermediate-binding-admission
