name: Fork CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  static:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: fork / static
    env:
      DSH_GATE_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run repository static gates
        env:
          DSH_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: pnpm run check:ci:static

  focused:
    runs-on: ubuntu-latest
    name: fork / focused tests
    env:
      DSH_GATE_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.10'

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Run fork benchmark tests when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scripts/dsh_bench.py ]]; then
            python -m py_compile scripts/dsh_bench.py scripts/dsh_bench_test.py
            python scripts/dsh_bench_test.py
          fi
          if [[ -f benchmarks/code-mode/suite.py ]]; then
            python -m py_compile benchmarks/code-mode/suite.py benchmarks/code-mode/suite_test.py
            python benchmarks/code-mode/suite_test.py
          fi

      - name: Run execution accounting tests
        run: pnpm exec vitest run packages/core/tools/tests/execution-accounting.spec.ts

      - name: Run trajectory package tests
        run: pnpm exec vitest run packages/client/ui-trajectory/tests
